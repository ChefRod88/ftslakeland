name = "ftslakeland"
main = "./workers/app.ts"
compatibility_date = "2025-08-21"
compatibility_flags = ["nodejs_compat"]

# Static client build (CSS, JS, images) is served straight from the edge;
# anything not matched falls through to the Worker for SSR.
[assets]
directory = "./build/client"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Plain vars (safe to commit). Secrets go in .dev.vars locally and
# `wrangler secret put` in production — see .dev.vars.example.
# ---------------------------------------------------------------------------
[vars]
SITE_URL = "http://localhost:5173"
REGISTRAR_EMAIL = "fltheologicalseminary@gmail.com"
FROM_EMAIL = "admissions@ftslakeland.org"
# Turnstile site key is public. Test key below always passes; replace for prod.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# ---------------------------------------------------------------------------
# Bindings. IDs are placeholders — create the resources and paste real IDs:
#   wrangler d1 create ftslakeland
#   wrangler kv namespace create KV
#   wrangler r2 bucket create ftslakeland-uploads
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "ftslakeland"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "KV"
id = "0000000000000000000000000000000000"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "ftslakeland-uploads"
